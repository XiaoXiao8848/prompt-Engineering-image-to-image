# Alembic 配置文件
# 文档: https://alembic.sqlalchemy.org/

[alembic]
# 迁移脚本目录
script_location = migrations

# 模板文件
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 是否使用 UTC 时间戳
# timezone = UTC

# 版本表名称
version_table = alembic_version

# 版本表架构（留空使用默认）
# version_table_schema =

# 是否使用事务包裹迁移
# 建议对支持 DDL 事务的数据库开启
transactional_ddl = true

# 输出编码
# output_encoding = utf-8

# 日志配置
[post_write_hooks]

# 日志格式
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
