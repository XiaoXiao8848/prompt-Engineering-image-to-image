# ==========================================
# Prompt Engine — 本地开发/测试环境 Docker Compose
# ==========================================

version: "3.8"

services:
  # === FastAPI 应用 ===
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Prompt Engine
      - DEBUG=true
      - ENV=development
      - DATABASE_URL=mysql+asyncmy://root:rootpass@mysql:3306/prompt_engine
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-development}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src:ro  # 开发模式挂载代码
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - prompt-engine-net

  # === Celery Worker ===
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - DATABASE_URL=mysql+asyncmy://root:rootpass@mysql:3306/prompt_engine
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=2
    networks:
      - prompt-engine-net

  # === Celery Beat（定时任务）===
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    command: celery -A src.tasks.celery_app beat --loglevel=info
    networks:
      - prompt-engine-net

  # === MySQL 8.0 ===
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: prompt_engine
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prompt-engine-net

  # === Redis 7 ===
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - prompt-engine-net

  # === Nginx 反向代理 ===
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - prompt-engine-net

volumes:
  mysql_data:
  redis_data:

networks:
  prompt-engine-net:
    driver: bridge
