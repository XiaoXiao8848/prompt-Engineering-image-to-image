# 场景模板：自然户外
# 适用：运动、户外、环保类产品
# LangChain PromptTemplate 格式

scene_id: outdoor_nature
scene_name: 自然户外

template: |
  {lock_tags}, natural outdoor setting, dappled sunlight through leaves,
  green foliage background, bokeh nature background,
  {props}, organic lifestyle, fresh air feeling,
  {material_keywords}, golden hour or soft overcast light,
  earthy tones, environmental harmony, natural composition,
  8k uhd, masterpiece, best quality, lifestyle photography

negative_prompt: |
  studio background, artificial lighting, urban elements, cluttered,
  low quality, blurry, deformed, distorted shape, wrong color,
  extra bottles, cropped, watermark, text, logo mutation, noise,
  plastic look, synthetic atmosphere

parameters:
  denoising_strength: 0.48
  cfg_scale: 7.5
  steps: 30
  sampler: DPM++ 2M Karras
