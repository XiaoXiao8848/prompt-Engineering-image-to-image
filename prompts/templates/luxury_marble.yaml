# LangChain PromptTemplate 格式

scene_id: luxury_marble
scene_name: 轻奢大理石

template: |
  {lock_tags}, marble texture background, gold accents and details,
  luxury aesthetic, dramatic side lighting, elegant composition,
  {props}, premium skincare presentation, rich textures,
