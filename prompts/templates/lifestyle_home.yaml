# 场景模板：家居生活
# 适用：日用品、家电、食品、护肤品
# LangChain PromptTemplate 格式

scene_id: lifestyle_home
scene_name: 家居生活

template: |
  {lock_tags}, cozy home setting, natural window light streaming in,
  wooden table surface, warm tones, morning routine atmosphere,
  {props}, soft bokeh background, lifestyle photography,
  {material_keywords}, intimate composition, authentic moment,
  golden hour lighting, shallow depth of field, 8k uhd, masterpiece, best quality

negative_prompt: |
  studio background, artificial lighting, cold tones, cluttered,
  low quality, blurry, deformed, distorted shape, wrong color,
  extra bottles, cropped, watermark, text, logo mutation, noise

parameters:
  denoising_strength: 0.45
  cfg_scale: 7.5
  steps: 30
  sampler: DPM++ 2M Karras
