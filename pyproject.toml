[project]
name = "yc-prompt-eg"
version = "0.2.0"
description = "Prompt Engineering Image-to-Image — 多场景提示词生成服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # === Web Framework ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncmy>=0.2.10",
    "alembic>=1.15.0",

    # === Redis ===
    "redis[asyncio]>=5.2.0",

    # === Task Queue ===
    "celery>=5.4.0",

    # === Validation & Config ===
    "pydantic>=2.13.4",
    "pydantic-settings>=2.8.0",
    "email-validator>=2.2.0",

    # === Authentication & Security ===
    "python-jose[cryptography]>=3.4.0",
    "passlib[bcrypt]>=1.7.4",

    # === LLM & Template ===
    "langchain>=1.3.1",
    "langchain-openai>=1.2.1",
    "openai>=1.40.0",
    "jinja2>=3.1.6",

    # === Config & Env ===
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",

    # === CLI & Display ===
    "rich>=15.0.0",
    "click>=8.1.0",

    # === HTTP Client ===
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",

    # === Utilities ===
    "ulid-py>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",  # for TestClient
    "faker>=35.0.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
